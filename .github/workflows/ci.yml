name: Server CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentx
          POSTGRES_PASSWORD: agentx
          POSTGRES_DB: agentx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentx -d agentx_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
        env:
          AGENTX_POSTGRES_TEST_URL: postgres://agentx:agentx@localhost:5432/agentx_test?sslmode=disable
      - run: go vet ./...
      - run: go build ./cmd/app
      - run: go build ./cmd/migrate
