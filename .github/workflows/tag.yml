name: Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to tag (for example 0.2.0 or v0.2.0)
        required: true
        type: string
      ref:
        description: Branch or commit to tag
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/app
      - run: go build ./cmd/migrate

  tag:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Validate and push tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "version must be a semantic version such as 0.2.0" >&2
            exit 1
          }
          tag="v$version"
          git fetch --tags origin
          git show-ref --tags --verify --quiet "refs/tags/$tag" && {
            echo "tag $tag already exists" >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$tag" --message "Release $tag"
          git push origin "$tag"
