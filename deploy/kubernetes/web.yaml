apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentx-web
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentx-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: agentx-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentx-web }
    spec:
      serviceAccountName: agentx-web
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: agentx-web }
      containers:
        - name: web
          image: ghcr.io/agentx-xai/agentx-web:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: agentx-web-config }
          readinessProbe:
            httpGet: { path: /_healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /_healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: cache
          emptyDir: { sizeLimit: 64Mi }
        - name: conf
          emptyDir: { sizeLimit: 8Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agentx-web
  labels: { app.kubernetes.io/name: agentx-web }
spec:
  selector: { app.kubernetes.io/name: agentx-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentx-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agentx-web }
