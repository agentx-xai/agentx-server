apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentx-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secret-store
  target:
    name: agentx-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: AGENTX_DATABASE_URL
      remoteRef:
        key: agentx/production/database-url
    - secretKey: AGENTX_S3_ACCESS_KEY
      remoteRef:
        key: agentx/production/s3-access-key
    - secretKey: AGENTX_S3_SECRET_KEY
      remoteRef:
        key: agentx/production/s3-secret-key
    - secretKey: AGENTX_ARTIFACT_PUBLIC_KEYS
      remoteRef:
        key: agentx/production/artifact-public-keys
    - secretKey: AGENTX_SMTP_USERNAME
      remoteRef:
        key: agentx/production/smtp-username
    - secretKey: AGENTX_SMTP_PASSWORD
      remoteRef:
        key: agentx/production/smtp-password
