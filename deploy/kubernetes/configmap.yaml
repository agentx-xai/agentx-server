apiVersion: v1
kind: ConfigMap
metadata:
  name: agentx-api-config
data:
  AGENTX_DEPLOYMENT_MODE: hosted
  AGENTX_HTTP_ADDR: :8080
  AGENTX_ARTIFACT_STORE: s3
  AGENTX_S3_ENDPOINT: s3.example.com
  AGENTX_S3_BUCKET: agentx-production
  AGENTX_S3_SECURE: "true"
  AGENTX_OIDC_ISSUER: https://id.example.com
  AGENTX_JWT_AUDIENCE: agentx
  AGENTX_OIDC_CLI_CLIENT_ID: agentx-cli
  AGENTX_OIDC_CLI_SCOPE: openid profile email offline_access
  AGENTX_ALLOWED_ORIGINS: https://console.agentx.example.com
  AGENTX_CONSOLE_URL: https://console.agentx.example.com
  AGENTX_SMTP_ADDRESS: REPLACE_WITH_SMTP_HOST_PORT
  AGENTX_SMTP_FROM: REPLACE_WITH_NOTIFICATION_FROM_EMAIL
  AGENTX_SMTP_TLS_MODE: starttls
  AGENTX_TRUSTED_PROXIES: 10.0.0.0/8
  AGENTX_RATE_LIMIT_PER_MINUTE: "600"
  AGENTX_ALLOW_LEGACY_UNSCOPED: "false"
  AGENTX_ALLOW_UNDELIVERED_INVITATIONS: "false"
  AGENTX_TERMS_URL: REPLACE_WITH_HTTPS_TERMS_URL
  AGENTX_PRIVACY_URL: REPLACE_WITH_HTTPS_PRIVACY_URL
  AGENTX_SUPPORT_URL: REPLACE_WITH_HTTPS_SUPPORT_URL
  AGENTX_ABUSE_EMAIL: REPLACE_WITH_STAFFED_ABUSE_EMAIL
  AGENTX_SECURITY_EMAIL: REPLACE_WITH_STAFFED_SECURITY_EMAIL
  AGENTX_COMPLIANCE_ADMIN_IDS: REPLACE_WITH_OIDC_ISSUER_SUBJECT_PRINCIPAL_IDS
  AGENTX_AUDIT_RETENTION_DAYS: REPLACE_WITH_APPROVED_AUDIT_RETENTION_DAYS
  AGENTX_AUDIT_RETENTION_INTERVAL: 24h
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  OTEL_SERVICE_NAME: agentx-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentx-web-config
data:
  AGENTX_API_UPSTREAM: http://agentx-api:8080
  AGENTX_CSP_CONNECT_SRC: "'self' https://id.example.com"
